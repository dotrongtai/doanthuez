# Pipeline verification trigger — see docs/deployment/aws-setup-guide.md mục 5.
stages:
  - test
  - build
  - deploy

variables:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: "348517220499.dkr.ecr.ap-southeast-1.amazonaws.com"
  IMAGE_NAME: clinic-backend

test:
  stage: test
  image: node:20
  script:
    - npm ci
    - npx prisma generate
    - npx tsc --noEmit -p tsconfig.build.json
    - npm run test
  only:
    - main
    - develop

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  only:
    - main
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker build -t $ECR_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $ECR_REGISTRY/$IMAGE_NAME:latest .
    - docker push $ECR_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/$IMAGE_NAME:latest

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - >
      ssh $EC2_USER@$EC2_HOST "
        aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY &&
        sudo docker pull $ECR_REGISTRY/$IMAGE_NAME:latest &&
        sudo docker stop clinic-backend || true &&
        sudo docker rm clinic-backend || true &&
        sudo docker run -d --name clinic-backend --restart unless-stopped -p 127.0.0.1:3001:3001 --env-file ~/clinic/backend.env
          --log-driver=awslogs --log-opt awslogs-region=$AWS_REGION --log-opt awslogs-group=/clinic-system/backend --log-opt awslogs-create-group=true
          $ECR_REGISTRY/$IMAGE_NAME:latest &&
        sudo docker image prune -f
      "
